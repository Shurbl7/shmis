<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E5B47">
<title>Shemis Barber · Book a chair</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shemis Barber">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Cairo:wght@400;600;700;800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<style>
/* Shemis Barber booking app. Palette: barber-chair green leather, brass fittings, tiled off-white. */
:root{
  --bg:#F1F4F1; --surface:#FFFFFF; --surface-2:#E7ECE8; --ink:#13201B; --muted:#5A6A63; --line:#D5DDD8;
  --accent:#1E5B47; --accent-ink:#FFFFFF; --accent-soft:#DDEBE4; --brass:#8E6A22; --brass-soft:#F2E8D1;
  --danger:#B0302C; --ok:#25744F; --warn:#946411; --shadow:0 1px 2px rgba(19,32,27,.06),0 8px 24px rgba(19,32,27,.07);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --navh:0px; --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0C1613; --surface:#14211D; --surface-2:#1B2B26; --ink:#E5EEEA; --muted:#93A69E; --line:#263A33;
  --accent:#55C79D; --accent-ink:#06140E; --accent-soft:#16392D; --brass:#D9B263; --brass-soft:#352B19;
  --danger:#F2756E; --ok:#62CF98; --warn:#E5B358; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.shell{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(150px + var(--navh))}

.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.pole{width:14px;height:44px;border-radius:7px;flex:none;background:repeating-linear-gradient(-50deg,var(--danger) 0 6px,var(--surface) 6px 10px,var(--accent) 10px 16px,var(--surface) 16px 20px);box-shadow:inset 0 0 0 1.5px var(--brass);animation:spin 3s linear infinite;background-size:100% 40px}
@keyframes spin{to{background-position:0 40px}}
h1{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:.95;margin:0;text-transform:uppercase;letter-spacing:.01em}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);margin-top:4px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}

nav.tabs{display:flex;gap:2px;background:var(--surface-2);padding:4px;border-radius:999px}
nav.tabs button{display:flex;align-items:center;gap:7px;border:0;background:none;padding:8px 14px;border-radius:999px;font-weight:600;font-size:.88rem;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button svg{width:18px;height:18px}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
@media (max-width:700px){
  :root{--navh:calc(62px + env(safe-area-inset-bottom,0px))}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;border-radius:0;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));justify-content:space-around}
  nav.tabs button{flex-direction:column;gap:2px;font-size:.68rem;padding:6px 4px;border-radius:10px;flex:1;min-width:0}
  nav.tabs button span{overflow:hidden;text-overflow:ellipsis;max-width:100%}
  nav.tabs button[aria-selected="true"]{box-shadow:none;color:var(--accent);background:var(--accent-soft)}
  h1{font-size:1.7rem}
}

.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--brass-soft);border-radius:var(--r);padding:12px 14px;font-size:.9rem;margin-bottom:16px}
.notice svg{flex:none;width:18px;height:18px;color:var(--brass);margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:.95rem;border-radius:10px;padding:12px 20px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;transition:transform .08s,opacity .15s;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn.danger{background:transparent;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.btn.sm{padding:7px 12px;font-size:.84rem;border-radius:8px}
.btn svg{width:16px;height:16px}
.btn.google{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:var(--shadow)}
.btn.google svg{width:18px;height:18px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;font-size:.86rem;cursor:pointer;padding:4px 0}
.empty{text-align:center;color:var(--muted);padding:28px 16px;border:1.5px dashed var(--line);border-radius:var(--r);font-size:.92rem}
.empty b{display:block;color:var(--ink);font-size:1rem;margin-bottom:4px}
.skel{background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:var(--r);height:76px}
@keyframes sh{to{background-position:-200% 0}}

.steps{display:grid;gap:12px}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:box-shadow .2s,border-color .2s}
.acc[data-state="open"]{box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.acc-h{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;background:none;border:0;text-align:left;cursor:pointer}
.acc[data-state="todo"] .acc-h{cursor:default}
.num{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:500 .82rem var(--f-mono);background:var(--surface-2);color:var(--muted)}
.acc[data-state="open"] .num{background:var(--accent);color:var(--accent-ink)}
.acc[data-state="done"] .num{background:var(--accent-soft);color:var(--accent)}
.num svg{width:15px;height:15px}
.acc-t{flex:1;min-width:0}
.acc-t b{display:block;font-size:.98rem}
.acc-t span{display:block;color:var(--muted);font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc[data-state="done"] .acc-t span{color:var(--ink)}
.acc-x{font-size:.82rem;font-weight:600;color:var(--accent)}
.acc-b{padding:0 16px 16px}

.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.opt{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;min-width:0;transition:border-color .15s,background .15s}
.opt:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .name{font-weight:600}
.opt .meta{display:flex;justify-content:space-between;align-items:center;width:100%;gap:8px;color:var(--muted);font-size:.85rem}
.opt .price{font:500 .95rem var(--f-mono);color:var(--ink)}
.blocks{display:inline-flex;gap:3px;align-items:center}
.blocks i{width:10px;height:6px;border-radius:2px;background:var(--brass)}
.tick{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:none;place-items:center}
.tick svg{width:12px;height:12px}
.opt[aria-pressed="true"] .tick{display:grid}
.bopt{flex-direction:row;align-items:center;gap:12px}
.av{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:700 .95rem var(--f-body);background:var(--accent-soft);color:var(--accent)}
.av.any{background:var(--brass-soft);color:var(--brass)}
.av svg{width:20px;height:20px}

.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.day{flex:0 0 auto;scroll-snap-align:start;width:64px;padding:9px 0 8px;display:grid;justify-items:center;gap:1px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;cursor:pointer}
.day small{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.day b{font-family:var(--f-display);font-size:1.6rem;line-height:1.05}
.day em{font-style:normal;font-size:.68rem;color:var(--ok);font-weight:600;min-height:1em}
.day em.few{color:var(--warn)} .day em.none{color:var(--muted);font-weight:500}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day[aria-pressed="true"] small,.day[aria-pressed="true"] em{color:inherit;opacity:.85}
.day:disabled{opacity:.4;cursor:not-allowed}
.quick{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0 4px}
.slotgroup{margin-top:14px}
.slotgroup .eyebrow{display:flex;gap:8px;align-items:baseline;margin-bottom:8px}
.slotgroup .eyebrow span{font-weight:500;letter-spacing:0;text-transform:none}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.time{padding:10px 0;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;font:500 .92rem var(--f-mono);cursor:pointer;font-variant-numeric:tabular-nums}
.time:hover{border-color:var(--accent)}
.time[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:.85rem;font-weight:600}
.field .err{color:var(--danger);font-size:.8rem}
.field .hint{color:var(--muted);font-size:.8rem}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[aria-invalid="true"]{border-color:var(--danger)}
input[readonly]{color:var(--muted)}
textarea{resize:vertical;min-height:70px}
.who{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:10px;padding:12px;margin-bottom:12px}
.who div{flex:1;min-width:0}
.who b{display:block}
.who span{color:var(--muted);font-size:.86rem;font-family:var(--f-mono)}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem;font-weight:600;margin:4px 0 12px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.seg{display:flex;gap:2px;background:var(--surface-2);padding:4px;border-radius:10px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:9px 10px;border-radius:8px;font-weight:600;font-size:.88rem;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.aerr:empty{display:none}
.signin{text-align:center;padding:22px 12px;display:grid;gap:10px;justify-items:center}
.signin p{margin:0;color:var(--muted);max-width:40ch}

.bar{position:fixed;left:0;right:0;bottom:var(--navh);z-index:25;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:701px){.bar{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}}
.bar-in{max-width:748px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px}
.bar-sum{min-width:0}
.bar-sum b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-sum span{display:block;color:var(--muted);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price-t{font:500 1rem var(--f-mono);color:var(--ink)}

.ticket{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.ticket .tt{background:var(--accent);color:var(--accent-ink);padding:22px 22px 18px}
.ticket .tt .eyebrow{color:inherit;opacity:.8}
.ticket .big{font-family:var(--f-display);font-weight:800;font-size:2.6rem;line-height:1;text-transform:uppercase;margin-top:6px}
.ticket .tb{padding:18px 22px 22px;display:grid;gap:14px;border-top:2px dashed var(--line)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.kv div span{display:block;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.kv div b{font-weight:600}
.code{font:500 .85rem var(--f-mono);color:var(--brass)}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.success{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-weight:600}
.success i{width:30px;height:30px;border-radius:50%;background:var(--ok);color:var(--accent-ink);display:grid;place-items:center}
.success svg{width:16px;height:16px}

.mlist{display:grid;gap:10px}
.mcard{display:flex;gap:14px;align-items:center;padding:14px;flex-wrap:wrap}
.dateblk{flex:none;width:58px;text-align:center;border-radius:10px;background:var(--accent-soft);color:var(--accent);padding:6px 0}
.dateblk small{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em}
.dateblk b{display:block;font-family:var(--f-display);font-size:1.7rem;line-height:1}
.mcard .info{flex:1;min-width:150px}
.mcard .info b{display:block}
.mcard .info span{color:var(--muted);font-size:.86rem}
.mcard.past{opacity:.7}
.mcard.past .dateblk{background:var(--surface-2);color:var(--muted)}
.pill{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.pill.confirmed{background:var(--accent-soft);color:var(--accent)} .pill.completed{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.no_show{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
h2.sec{font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}

.sched-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.datenav{display:flex;align-items:center;gap:6px}
.datenav .lbl{font-family:var(--f-display);font-size:1.5rem;text-transform:uppercase;min-width:150px;text-align:center}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:16px;height:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{padding:12px 14px}
.stat span{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stat b{font:500 1.35rem var(--f-mono);font-variant-numeric:tabular-nums}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.tl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.tl{display:grid;position:relative;min-width:100%}
.tl .hd{position:sticky;top:0;z-index:2;background:var(--surface);padding:10px 8px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:600;font-size:.88rem}
.tl .hd .av{width:28px;height:28px;font-size:.75rem}
.tl .tm{font:500 .75rem var(--f-mono);color:var(--muted);padding:4px 8px;border-top:1px solid var(--line)}
.tl .cell{border-top:1px solid var(--line);border-left:1px solid var(--line)}
.tl .cell.half{border-top-style:dashed}
.blk{z-index:1;margin:3px;border-radius:8px;padding:6px 9px;text-align:left;border:0;cursor:pointer;background:var(--accent-soft);border-left:4px solid var(--accent);overflow:hidden;min-width:0}
.blk b{display:block;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk span{display:block;font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.completed{background:color-mix(in srgb,var(--ok) 13%,var(--surface));border-left-color:var(--ok)}
.blk.no_show{background:color-mix(in srgb,var(--warn) 13%,var(--surface));border-left-color:var(--warn);opacity:.8}
.nowline{z-index:3;height:2px;background:var(--danger);position:relative;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger)}

.scrim{position:fixed;inset:0;z-index:40;background:rgba(5,12,10,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:20px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));max-height:88vh;overflow:auto;box-shadow:var(--shadow);animation:up .2s ease-out}
@media (min-width:701px){.scrim{align-items:center}.sheet{border-radius:18px}}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.sheet h3{font-family:var(--f-display);font-size:2rem;text-transform:uppercase;margin:4px 0 10px;line-height:1}
.sheet .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.sheet .row>span{color:var(--muted);font-size:.86rem}
.sheet .note{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:.9rem;margin:6px 0}
.sheet .acts{margin-top:14px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}

.sgrid{display:grid;gap:14px}
.sbox{padding:16px}
.sbox h3{margin:0 0 4px;font-size:1rem}
.sbox p{margin:0 0 12px;color:var(--muted);font-size:.86rem}
.hours{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:360px}
.dchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.dchip{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer}
.dchip[aria-pressed="true"]{background:var(--danger);border-color:var(--danger);color:#fff}
.erow{display:grid;grid-template-columns:1fr 110px 110px 40px;gap:8px;align-items:center;margin-bottom:8px}
.erow.b{grid-template-columns:42px 1fr 40px}
.erow .av{width:36px;height:36px;font-size:.8rem}
.ehead{display:grid;grid-template-columns:1fr 110px 110px 40px;gap:8px;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.del{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:none;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.del:hover{color:var(--danger);border-color:var(--danger)}
.del svg{width:16px;height:16px}
@media (max-width:520px){.erow{grid-template-columns:1fr 1fr 40px}.erow .nm{grid-column:1/-1}.ehead{display:none}.form{grid-template-columns:1fr}}

/* owner dashboard */
#dash{display:grid;gap:14px}
#dash>*,.dgrid>*{min-width:0}
.dstatus.on{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.dstatus.off{border-color:color-mix(in srgb,var(--danger) 50%,var(--line));background:color-mix(in srgb,var(--danger) 6%,var(--surface))}
.dstat-row{display:flex;gap:16px;align-items:center;justify-content:space-between}
.dbig{font-family:var(--f-display);font-weight:800;font-size:1.9rem;text-transform:uppercase;line-height:1.05;margin:2px 0 4px}
.dstatus.on .dbig{color:var(--ok)} .dstatus.off .dbig{color:var(--danger)}
.switch{flex:none;width:68px;height:38px;border-radius:999px;border:0;background:var(--line);position:relative;cursor:pointer;transition:background .2s}
.switch i{position:absolute;top:4px;left:4px;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"] i{transform:translateX(30px)}
.switch:disabled{opacity:.5}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.dgrid .stat small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.dgrid .skel{height:90px}
.dcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dcols>*{min-width:0}
.dhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.dhead h3{margin:0}
.sub{color:var(--muted);font-size:.8rem;font-weight:400}
.dh4{margin:16px 0 6px;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.nrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.nrow:first-of-type{border-top:0}
.ntime{font:500 .95rem var(--f-mono);min-width:54px;color:var(--accent)}
.ninfo{flex:1;min-width:0}
.ninfo b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ninfo span{color:var(--muted);font-size:.84rem}
a.iconbtn{color:var(--ink)}
.bars{display:flex;align-items:flex-end;gap:5px;height:170px;padding-top:6px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bcol .bfill{width:100%;max-width:28px;border-radius:5px 5px 2px 2px;background:var(--accent);opacity:.85}
.bcol.past .bfill{background:var(--muted);opacity:.45}
.bcol.today .bfill{background:var(--brass);opacity:1}
.bcol .bn{font:500 .72rem var(--f-mono);color:var(--muted);min-height:1.1em}
.bcol .bl{font-size:.66rem;color:var(--muted);margin-top:5px;white-space:nowrap}
.bcol.today .bl{color:var(--brass);font-weight:700}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) 1.2fr auto;gap:10px;align-items:center;padding:6px 0}
.hk{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.9rem}
.htrack{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.htrack span{display:block;height:100%;background:var(--accent);border-radius:4px}
.hv{font:500 .8rem var(--f-mono);color:var(--muted);white-space:nowrap}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.plist div{background:var(--bg);border-radius:10px;padding:10px 12px;display:grid}
.plist span{font-weight:600;font-size:.9rem}
.plist small{color:var(--muted);font-size:.78rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto}
.ctbl{width:100%;border-collapse:collapse;font-size:.88rem;min-width:520px}
.ctbl th{text-align:left;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px;border-bottom:1px solid var(--line)}
.ctbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.ctbl a{color:var(--accent);text-decoration:none}
@media (max-width:700px){.dgrid{grid-template-columns:repeat(2,1fr)}.dcols{grid-template-columns:1fr}.dbig{font-size:1.5rem}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 90px);z-index:50;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;font-size:.9rem;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
/* language, RTL, new pieces */
.brand{flex:1;min-width:0}
.langbtn{margin-inline-start:auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 .82rem var(--f-body);cursor:pointer;white-space:nowrap}
.top nav.tabs{max-width:100%;overflow-x:auto}
html[lang="ar"]{--f-body:"Cairo","Figtree",system-ui,sans-serif;--f-display:"Cairo","Big Shoulders Display",Impact,sans-serif}
html[lang="ar"] h1,html[lang="ar"] .dbig,html[lang="ar"] .ticket .big,html[lang="ar"] .sheet h3{letter-spacing:0;font-weight:800}
html[lang="ar"] .eyebrow,html[lang="ar"] h2.sec,html[lang="ar"] .stat span,html[lang="ar"] .dh4,html[lang="ar"] .ctbl th{letter-spacing:0}
[dir="rtl"] .tick{right:auto;left:10px}
[dir="rtl"] .blk{border-left:0;border-right:4px solid var(--accent)}
[dir="rtl"] .blk.completed{border-right-color:var(--ok)} [dir="rtl"] .blk.no_show{border-right-color:var(--warn)}
[dir="rtl"] .tl .cell{border-left:0;border-right:1px solid var(--line)}
[dir="rtl"] .switch i{left:auto;right:4px}
[dir="rtl"] .switch[aria-checked="true"] i{transform:translateX(-30px)}
[dir="rtl"] .ctbl th{text-align:right}
[dir="rtl"] .opt,[dir="rtl"] .acc-h,[dir="rtl"] .blk{text-align:right}
.offcell{background:repeating-linear-gradient(-45deg,transparent 0 8px,var(--surface-2) 8px 10px)}
.erow.b3{grid-template-columns:42px 1fr 1fr 40px}
.tact{white-space:nowrap;text-align:end}
.tact .btn{margin-inline-start:4px}
.pwrow{background:var(--bg);border-radius:10px;padding:10px}
.pwrow span{font-size:.88rem}
.mbars{height:130px;gap:2px}
.mbars .bcol .bfill{max-width:16px;border-radius:3px 3px 1px 1px}
.savebar{position:sticky;bottom:calc(var(--navh) + 8px);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);z-index:5}
@media (max-width:520px){.erow.b3{grid-template-columns:36px 1fr 40px}.erow.b3 input[data-bl]{grid-column:2/3}}
/* ===== website look ===== */
.shell{max-width:1080px}
main:not(#view-home),#notice{max-width:780px;margin-inline:auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:-18px calc(-1*max(16px,env(safe-area-inset-left,0px))) 22px;padding:12px max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .brand{flex:1 1 260px}
.top h1{font-size:1.45rem}
.top .pole{height:36px;width:12px}
.top nav.tabs{align-self:auto}
body[data-tab="home"] .top .status{display:none}
.ownerbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--brass-soft);border-radius:12px;padding:10px 14px;margin-bottom:18px;font-size:.9rem}
.ownerbar span{flex:1;min-width:160px}
.btn.big{padding:15px 26px;font-size:1.05rem;border-radius:12px}
/* hero */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);gap:28px;align-items:center;padding:clamp(28px,6vw,64px) clamp(20px,4vw,48px);border-radius:24px;overflow:hidden;
  background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--accent) 30%,transparent),transparent 55%),linear-gradient(160deg,#10241D,#0A1612);color:#EAF2EE;margin-bottom:36px}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:6px;background:repeating-linear-gradient(-45deg,#C8362F 0 14px,#EAF2EE 14px 22px,#2E7A5E 22px 36px,#EAF2EE 36px 44px);opacity:.9}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);font-size:.85rem;color:#C9D6D0}
.chip .dot.on{background:#5BD39A}
.hero-title{font-family:var(--f-display);font-weight:800;font-size:clamp(2.8rem,8vw,5.6rem);line-height:.9;text-transform:uppercase;margin:18px 0 14px;letter-spacing:.005em;color:#F3F7F5;text-wrap:balance}
.hero-tag{font-size:clamp(1.05rem,2.2vw,1.3rem);color:#B9C9C1;margin:0 0 26px;max-width:34ch}
.hero .btn{border-color:#5BD39A;background:#5BD39A;color:#06140E}
.hero .btn.ghost{background:transparent;color:#EAF2EE;border-color:rgba(255,255,255,.28)}
.hero .notice{background:rgba(217,178,99,.15);color:#F1E3C2}
.hero-side{display:flex;flex-direction:column;align-items:center;gap:22px}
.bigpole{position:relative;width:74px;height:230px;border-radius:37px;overflow:hidden;box-shadow:0 0 0 4px #D9B263,0 18px 40px rgba(0,0,0,.45)}
.bigpole i{position:absolute;inset:-60px 0 0;background:repeating-linear-gradient(-50deg,#C8362F 0 16px,#F3F7F5 16px 26px,#2E7A5E 26px 42px,#F3F7F5 42px 52px);animation:polespin 3.2s linear infinite}
@keyframes polespin{to{transform:translateY(60px)}}
.bigpole::before,.bigpole::after{content:"";position:absolute;left:-6px;right:-6px;height:12px;background:#D9B263;z-index:1;border-radius:6px}
.bigpole::before{top:0}.bigpole::after{bottom:0}
.hero-card{width:100%;max-width:270px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:6px 16px}
.hc-row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid rgba(255,255,255,.1);font-size:.9rem}
.hc-row:first-child{border-top:0}
.hc-row span{color:#A9BBB2}
.hc-row b{font-family:var(--f-mono);font-weight:500;color:#F3F7F5;white-space:nowrap}
/* sections */
.hsec{margin:0 0 44px}
.hhead{margin-bottom:16px}
.hhead h3{font-family:var(--f-display);font-weight:800;font-size:clamp(1.9rem,4vw,2.6rem);text-transform:uppercase;line-height:1;margin:6px 0 0}
.about p{font-size:clamp(1.05rem,2vw,1.25rem);line-height:1.7;max-width:62ch;margin:0;padding-inline-start:18px;border-inline-start:3px solid var(--brass)}
.menu{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px clamp(14px,3vw,26px)}
.mrow{display:flex;align-items:center;gap:14px;padding:16px 0;border-top:1px dashed var(--line)}
.mrow:first-child{border-top:0}
.mname{min-width:0}
.mname b{display:block;font-size:1.08rem}
.mname span{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:.84rem}
.mname svg{width:14px;height:14px}
.lead{flex:1;min-width:20px;border-bottom:2px dotted color-mix(in srgb,var(--muted) 50%,transparent);transform:translateY(-6px)}
.mprice{font:500 1.15rem var(--f-mono);white-space:nowrap}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.tav{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font:800 1.5rem var(--f-display);background:var(--accent-soft);color:var(--accent);box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--brass)}
.tcard b{font-size:1.05rem}
.hsec.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.hsec.two>*{min-width:0}
.hours7{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 18px}
.hrs{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.hrs:first-child{border-top:0}
.hrs b{font-family:var(--f-mono);font-weight:500}
.hrs.now span,.hrs.now b{color:var(--accent);font-weight:700}
.visit{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 18px}
.vrow{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.vrow:first-child{border-top:0}
.vrow>svg{flex:none;width:22px;height:22px;color:var(--brass);margin-top:2px}
.vrow b{display:block;margin-bottom:2px}
.vrow a.linkbtn{text-decoration:none}
.ctaband{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;padding:clamp(22px,4vw,36px);border-radius:20px;background:var(--accent);color:var(--accent-ink);margin-bottom:28px}
.ctaband h3{font-family:var(--f-display);font-weight:800;font-size:clamp(1.7rem,4vw,2.4rem);text-transform:uppercase;margin:0 0 4px;line-height:1}
.ctaband p{margin:0;opacity:.85}
.ctaband .btn{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;color:var(--muted);font-size:.85rem;padding:18px 0 4px;border-top:1px solid var(--line)}
@media (max-width:700px){.top{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}}
@media (max-width:760px){
  .hero{grid-template-columns:1fr;border-radius:18px}
  .hero-side{flex-direction:row;align-items:center;justify-content:space-between}
  .bigpole{width:44px;height:130px;flex:none}
  .hero-card{max-width:none}
  .hsec.two{grid-template-columns:1fr}
  .hero-cta .btn{flex:1}
  .mrow{flex-wrap:wrap}.lead{display:none}.mname{flex:1}
  .top{margin-bottom:16px}
}
@media (prefers-reduced-motion:reduce){.bigpole i{animation:none}}

/* payments */
.payblock{margin-top:12px;padding:14px;border-radius:12px;background:var(--surface-2)}
.payhead{font-weight:700;font-size:.9rem;margin-bottom:8px}
.paym{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pmeth{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px;font-weight:600;font-size:.84rem;cursor:pointer}
.pmeth[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.paydone{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.paydone b{font-size:1.1rem}
.paydone span:not(.pill){color:var(--muted);font-size:.88rem;flex:1}
.unpaid{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
@media (max-width:420px){.paym{grid-template-columns:repeat(2,1fr)}}

/* prices, promo, payment choice */
.priceblk{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:4px 0 14px;background:var(--surface)}
.prow{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-size:.95rem}
.prow.disc{color:var(--ok)}
.prow.total{border-top:1px dashed var(--line);margin-top:4px;padding-top:8px;font-weight:700;font-size:1.05rem}
.promo{display:flex;gap:8px;margin-top:10px}
.promo input{text-transform:uppercase}
.paychoose{margin-bottom:14px}
.paychoose .paym{margin-top:4px}
.okline{color:var(--ok);font-weight:600;font-size:.9rem}
.paynote{background:var(--surface-2);border-radius:10px;padding:10px 12px;display:grid;gap:4px;font-size:.92rem}
.paynote>span{color:var(--muted);font-size:.8rem}
.dtag{position:absolute;top:-7px;inset-inline-end:-6px;font-style:normal;font-size:.62rem;font-weight:700;background:var(--ok);color:#fff;border-radius:999px;padding:1px 6px}
.day{position:relative}
.waitbox{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);color:var(--fg)}
.waitbox p{margin:0 0 8px;color:var(--muted)}
.notice.good{background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.notice.good svg{color:var(--ok)}
/* loyalty */
.loyal{padding:14px 16px;margin-bottom:16px}
.lhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;margin-bottom:10px}
.lhead span{color:var(--muted);font-size:.88rem}
.stamps{display:flex;flex-wrap:wrap;gap:8px}
.stamps i{width:30px;height:30px;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;font-style:normal;font-size:.8rem;font-weight:700;color:var(--accent)}
.stamps i.on{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.stamps i.gift{border-color:var(--brass);color:var(--brass)}
/* offers on home */
.offers{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.offer{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--surface);display:grid;gap:2px}
.offer b{font-size:1.6rem;color:var(--accent);line-height:1.1}
.offer span{color:var(--muted)}
/* settings */
.erow.b4{grid-template-columns:42px 1fr 1fr 86px 40px}
.pctin{display:flex;align-items:center;gap:4px}
.pctin input{width:100%;min-width:0}
.pctin span{color:var(--muted);font-weight:600}
.ddisc{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.ddisc label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--surface)}
.ddisc span{flex:1;font-size:.88rem}
.ddisc input{width:56px;padding:6px 8px}
.ddisc em{font-style:normal;color:var(--muted)}
.promoadd{margin-bottom:10px}
.promoadd .pctin input{width:70px}
.plist2{display:grid;gap:6px}
.pcrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.pcrow b{font-size:1rem;letter-spacing:.04em}
.pcrow .sub{flex:1;min-width:120px}
.pcrow.off{opacity:.55}
@media (max-width:560px){.erow.b4{grid-template-columns:38px 1fr 80px 40px}.erow.b4 input[data-bl]{grid-column:2/4;grid-row:2}}
.dchip[data-pmt][aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.paydet{display:grid;gap:8px;justify-items:start;margin-top:4px}
.copyline{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.copyline b{font-size:1.02rem}
.mpay{flex-basis:100%;border-top:1px dashed var(--line);padding-top:10px}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.gitem{padding:0;border:0;border-radius:12px;overflow:hidden;aspect-ratio:1;cursor:zoom-in;background:var(--surface-2)}
.gitem img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.gitem:hover img{transform:scale(1.04)}
.lbox{position:fixed;inset:0;z-index:60;background:rgba(5,10,8,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) 16px max(20px,env(safe-area-inset-bottom,0px))}
.lbox img{max-width:100%;max-height:82vh;border-radius:10px;object-fit:contain}
.lbox p{color:#E6EEE9;margin:12px 0 0;text-align:center}
.lbox .iconbtn{position:absolute;background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
.lbx{top:calc(14px + env(safe-area-inset-top,0px));inset-inline-end:14px}
.lbp{inset-inline-start:14px;top:50%}.lbn{inset-inline-end:14px;top:50%}
.galadmin{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.gadm{position:relative;display:grid;gap:6px}
.gadm img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.gadm .del{position:absolute;top:6px;inset-inline-end:6px;background:var(--surface);width:34px;height:34px}
.gadm input{padding:7px 9px;font-size:.85rem}
.upl{cursor:pointer}
/* reviews */
.stars{display:inline-flex;gap:1px;color:var(--line);font-size:1rem;line-height:1}
.stars i{font-style:normal}.stars i.on{color:#E0A526}
.stars.big{font-size:1.5rem}
.revsum{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.revsum b{font-size:1.6rem}.revsum span{color:var(--muted)}
.revs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.rev{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:8px}
.rev blockquote{margin:0;font-size:1rem;line-height:1.55}
.rev figcaption{color:var(--muted);font-size:.86rem}

  const key=[s.service,s.date,S.promo.code||"",uid()].join("|");if(key===S.quoteKey)return;S.quoteKey=key;
  const {data,error}=await sb.rpc("quote",{p_service:s.service,p_day:s.date,p_code:S.promo.code});

document.addEventListener("click",e=>{const b=e.target.closest("[data-am]");if(!b)return;
  const f=document.querySelector("[data-authform]");if(f)S.authDraft={full_name:f.full_name?.value,phone:f.phone?.value,username:f.username?.value};
  S.authMode=b.dataset.am;renderTab();renderBar()});
document.addEventListener("submit",e=>{const f=e.target.closest("[data-authform]");if(!f)return;e.preventDefault();doAuth(f)});
async function doAuth(f){
  const err=t=>{f.querySelector(".aerr").textContent=t};err("");
  const btn=f.querySelector("button[type=submit]");
  const u=(f.username.value||"").trim().toLowerCase(),pw=f.password.value||"";
  const signup=S.authMode==="signup";let name="",phone="";
  if(signup){name=f.full_name.value.trim();phone=normPhone(f.phone.value);
    if(name.length<2){err(T("Enter your full name."));f.full_name.focus();return}
    if(!validPhone(phone)){err(T("Enter a mobile number, e.g. 010 1234 5678."));f.phone.focus();return}}
  if(!validUname(u)){err(T("Username: 3–20 characters, using letters, numbers, dots or underscores."));f.username.focus();return}
  if(pw.length<6){err(T("Password must be at least 6 characters."));f.password.focus();return}
  btn.disabled=true;btn.textContent=T(signup?"Creating account…":"Signing in…");
  try{
    if(signup){
      const {data,error}=await sb.auth.signUp({email:unameToEmail(u),password:pw,options:{data:{username:u,full_name:name}}});
      if(error){err(/already|registered|exists/i.test(error.message)?T("That username is taken. Pick another, or sign in."):errMsg(error));return}
      if(!data.session){err(T("Your account was created but can't sign in yet. Please contact the shop."));return}
      S.session=data.session;
      const {data:p,error:pe}=await sb.from("profiles").upsert({id:data.user.id,full_name:name,phone}).select().single();
      if(!pe)S.profile=p;
      S.authDraft=null;toast(T("Welcome, {0}!",name.split(" ")[0]));
    }else{
      const {error}=await sb.auth.signInWithPassword({email:unameToEmail(u),password:pw});
      if(error){err(/invalid/i.test(error.message)?T("Wrong username or password."):errMsg(error));return}
      S.authDraft=null;toast(T("Signed in."));
    }
  }finally{if(btn.isConnected){btn.disabled=false;btn.textContent=T(signup?"Create account":"Sign in")}}
}

let authSeq=0;
async function onSession(session){
  const seq=++authSeq;S.session=session;
  if(!session){S.profile=null;S.role="customer";S.barberId=null;S.mine=[];unsubLive();renderAll();return}
  const [{data:adm},{data:bid},{data:did},{data:prof}]=await Promise.all([sb.rpc("is_admin"),sb.rpc("my_barber_id"),sb.rpc("my_desk_id"),sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle()]);
  if(seq!==authSeq)return;
  const wasRole=S.role;
  S.role=adm?"admin":bid?"barber":did?"desk":"customer";S.barberId=bid||null;S.deskId=(!adm&&!bid&&did)||null;S.my=null;
  S.profile=prof||(S.profile&&S.profile.id===session.user.id?S.profile:null);
  if(S.role!==wasRole&&!(S.tab==="book"&&S.step===4))S.tab=tabsFor()[0][0];
  subLive();loadMine();loadWait();if(isFront()||isBarber())loadSched();if(isAdmin())loadDash();if(isStaff())loadMyClock();S.push=null;refreshPush();
  renderAll();
}
sb.auth.onAuthStateChange((ev,session)=>{if(ev==="TOKEN_REFRESHED"){S.session=session;return}setTimeout(()=>onSession(session),0)});

function closeMin(){const c=toMin(cfg().close);return c===0?1440:c}
function slotTimes(){const o=toMin(cfg().open),e=closeMin(),r=[];for(let t=o;t+STEP<=e;t+=STEP)r.push(t);return r}
function isClosedDay(k){return (cfg().closed_days||[]).includes(parseKey(k).getDay())||(cfg().holidays||[]).includes(k)}
const shopPaused=()=>!!S.cfg&&S.cfg.is_open===false;
function renderStatus(){
  if(!S.cfg){$("openText").textContent=T(S.loadErr?"Can't reach the booking system":"Loading hours…");return}
  const c=S.cfg,n=nowMin(),closed=isClosedDay(today()),open=!closed&&n>=toMin(c.open)&&n<closeMin();
  $("shopName").textContent=c.shop_name||"Shemis Barber";document.title=(c.shop_name||"Shemis Barber")+" · "+T("Book a chair");
  $("openDot").className="dot"+(open&&!shopPaused()?" on":"");
  $("openText").textContent=shopPaused()?T("Closed for bookings right now"):open?T("Open now · closes {0}",fmtS(c.close)):closed?T("Closed today"):(n<toMin(c.open)?T("Opens today at {0}",fmtS(c.open)):T("Closed now · opens {0}",fmtS(c.open)));
}

/* ===== availability ===== */
async function loadBusy(){
  const {data,error}=await sb.rpc("get_busy",{p_from:today(),p_to:addDays(today(),DAYS-1)});
  if(error)return;
  const t=new Set();for(const r of data)for(let m=r.start_min;m<r.end_min;m+=STEP)t.add(`${r.day}_${r.barber_id}_${m}`);
  S.taken=t;
  if(S.sel.time!=null&&S.sel.date&&!S.busy&&!S.done&&!startsFor(S.sel.date).includes(S.sel.time)){S.sel.time=null;if(S.step===4){S.step=3;toast(T("That time was just taken. Please pick another."))}}
  if(S.tab==="book")renderBook();if(S.tab==="home")renderHome();
}
const svcOf=()=>activeServices().find(s=>s.id===S.sel.service);
function barberFree(date,bid,t,dur){
  if(t+dur>closeMin())return false;
  if(date===today()&&t<=nowMin()+10)return false;
  for(let x=t;x<t+dur;x+=STEP)if(S.taken.has(`${date}_${bid}_${x}`))return false;
  return true;
}
const freeBarbers=(date,t,dur)=>activeBarbers().filter(b=>barberFree(date,b.id,t,dur));
function startsFor(date){
  const s=svcOf();if(!s||!S.sel.barber||isClosedDay(date))return[];
  const dur=s.minutes+homeExtra();return slotTimes().filter(t=>S.sel.barber==="any"?freeBarbers(date,t,dur).length>0:barberFree(date,S.sel.barber,t,dur));
}
function earliest(){for(let i=0;i<DAYS;i++){const k=addDays(today(),i),st=startsFor(k);if(st.length)return{date:k,time:st[0]}}return null}

/* ===== booking flow ===== */
function stateOf(n){if(n===S.step)return"open";const s=S.sel;return({1:!!s.service,2:!!s.barber,3:!!s.date&&s.time!=null,4:false}[n])?"done":"todo"}
function head(n,title,summary,hint){const st=stateOf(n);
  return `<button class="acc-h" data-open="${n}" ${st==="todo"?'tabindex="-1"':""} aria-expanded="${st==="open"}"><span class="num">${st==="done"?ICON.check:n}</span><span class="acc-t"><b>${title}</b><span>${st==="done"?summary:hint}</span></span>${st==="done"?`<span class="acc-x">${T("Change")}</span>`:""}</button>`}
function renderBook(){
  if(S.done){renderDone();return}
  if(shopPaused()&&!isFront()){$("steps").hidden=true;$("bookDone").hidden=false;$("bar").hidden=true;
    $("bookDone").innerHTML=`<div class="empty" style="padding:40px 16px"><b>${T("We're not taking bookings right now")}</b>${esc(S.cfg.closed_note||T("Please check back soon."))}</div>`;return}
  $("bookDone").hidden=true;$("steps").hidden=false;
  const s=S.sel,svc=svcOf(),brb=activeBarbers().find(b=>b.id===s.barber);
  let b1;
  if(!S.loaded)b1=`<div class="grid2"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>`;
  else if(S.loadErr)b1=`<div class="empty"><b>${T("Can't reach the booking system")}</b>${T("Check your connection, then try again.")}<div style="margin-top:10px"><button class="btn sm" id="retry">${T("Try again")}</button></div></div>`;
  else if(!activeServices().length)b1=`<div class="empty"><b>${T("No services listed yet")}</b>${T(isAdmin()?"Add your services in Settings and they'll show up here.":"The shop is still setting up. Check back soon.")}</div>`;
  else b1=`<div class="grid2">${activeServices().map(x=>`<button type="button" class="opt" data-svc="${esc(x.id)}" aria-pressed="${s.service===x.id}"><span class="tick">${ICON.check}</span><span class="name">${esc(x.name)}</span><span class="meta"><span class="blocks">${"<i></i>".repeat(Math.ceil(x.minutes/STEP))}&nbsp;${T("{0} min",x.minutes)}</span><span class="price">${EGP(x.price)}</span></span></button>`).join("")}</div>`;
  $("acc1").dataset.state=stateOf(1);
  $("acc1").innerHTML=head(1,T("Choose a service"),svc?`${esc(svc.name)} · ${T("{0} min",svc.minutes)} · ${EGP(svc.price)}`:"",T("What are we doing today?"))+(S.step===1?`<div class="acc-b">${b1}</div>`:"");
  const bs=activeBarbers();
  const b2=!bs.length?`<div class="empty"><b>${T("No barbers listed yet")}</b></div>`:
    `<div class="grid2"><button type="button" class="opt bopt" data-brb="any" aria-pressed="${s.barber==="any"}"><span class="tick">${ICON.check}</span><span class="av any">${ICON.any}</span><span><span class="name">${T("Any barber")}</span><span class="meta">${T("Most free times")}</span></span></button>`+
    bs.map(b=>`<button type="button" class="opt bopt" data-brb="${esc(b.id)}" aria-pressed="${s.barber===b.id}"><span class="tick">${ICON.check}</span><span class="av">${esc(initials(b.name))}</span><span><span class="name">${esc(b.name)}</span>${barberOff(b.id,today())?`<span class="meta">${T("Off today")}</span>`:""}</span></button>`).join("")+`</div>`;
  $("acc2").dataset.state=stateOf(2);
  $("acc2").innerHTML=head(2,T("Choose your barber"),s.barber==="any"?T("Any barber · first free chair"):esc(brb?.name||""),T("Pick someone or take the first free chair"))+(S.step===2?`<div class="acc-b">${b2}</div>`:"");
  $("acc3").dataset.state=stateOf(3);
  $("acc3").innerHTML=head(3,T("Pick a day & time"),s.date&&s.time!=null?T("{0} at {1}",nice(s.date),fmt(s.time)):"",T("See what's free in the next two weeks"))+(S.step===3?`<div class="acc-b">${timeBody()}</div>`:"");
  if(S.step===4&&S.session)loadQuote();
  $("acc4").dataset.state=stateOf(4);
  $("acc4").innerHTML=head(4,T("Confirm"),"",T(S.session?"Check your details and confirm":"Sign in and confirm your booking"))+(S.step===4?`<div class="acc-b">${confirmBody()}</div>`:"");
  renderBar();
}
function timeBody(){
  const s=S.sel;if(!s.date)s.date=today();
  let days="";
  for(let i=0;i<DAYS;i++){const k=addDays(today(),i),d=parseKey(k),closed=isClosedDay(k),n=closed?0:startsFor(k).length;
    days+=`<button type="button" class="day" data-day="${k}" aria-pressed="${s.date===k}" ${closed?"disabled":""}><small>${i===0?T("Today"):dayName(d.getDay())}</small><b>${d.getDate()}</b><em class="${closed||!n?"none":n<4?"few":""}">${closed?T("Closed"):n?T("{0} free",n):T("Full")}</em>${!closed&&dayPct(k)?`<i class="dtag">−${dayPct(k)}%</i>`:""}</button>`}
  const e=earliest();
  const quick=e&&!(e.date===s.date&&e.time===s.time)?`<div class="quick"><span class="eyebrow">${T("Earliest")}</span><button type="button" class="btn soft sm" data-quick="${e.date}|${e.time}">${nice(e.date)} · ${fmt(e.time)}</button></div>`:"";
  let body;
  if(isClosedDay(s.date))body=`<div class="empty" style="margin-top:12px"><b>${T("The shop is closed that day.")}</b>${T("Pick another day above.")}</div>`;
  else{const st=startsFor(s.date);
    if(!st.length){const onList=(S.wait||[]).find(w=>w.day===s.date);
      body=`<div class="empty" style="margin-top:12px"><b>${T(s.barber!=="any"&&barberOff(s.barber,s.date)?"That barber is off that day.":"Fully booked this day")}</b>${T(s.barber!=="any"?"Try another day or choose Any barber.":"Try another day.")}
      ${isFront()?"":`<div class="waitbox">${onList?`${T("You're on the waiting list for this day.")} <button class="linkbtn" data-wleave="${esc(onList.id)}">${T("Leave the list")}</button>`:S.session?`<p>${T("Want this day? Join the waiting list and we'll show you here if someone cancels.")}</p><button class="btn sm" data-wjoin="1">${T("Join the waiting list")}</button>`:`<p>${T("Sign in to join the waiting list for this day.")}</p>`}</div>`}</div>`}
    else{const groups=[["Morning",0,720],["Afternoon",720,1020],["Evening",1020,1260],["Night",1260,1e4]];
      body=groups.map(([g,a,z])=>{const ts=st.filter(t=>t>=a&&t<z);return ts.length?`<div class="slotgroup"><div class="eyebrow">${T(g)}<span>${T("{0} free",ts.length)}</span></div><div class="times">${ts.map(t=>`<button type="button" class="time" data-time="${t}" aria-pressed="${s.time===t}">${fmt(t)}</button>`).join("")}</div></div>`:""}).join("")}}
  return `<div class="days" id="daystrip">${days}</div>${quick}${body}`;
}
function confirmBody(){
  if(!S.session)return `<p style="margin:0 0 12px;color:var(--muted)">${T("Create a free account or sign in to confirm. Your choices stay saved while you do.")}</p>${authForm()}`;
  const noteField=`<div class="field full"><label for="cNote">${T("Note for your barber")} <span style="color:var(--muted);font-weight:400">(${T("optional")})</span></label><textarea id="cNote" maxlength="300" placeholder="${T("e.g. low skin fade, keep the length on top")}">${esc(S.note)}</textarea></div>`;
  if(!S.profile||S.profEdit)return `<p style="margin:0 0 12px;color:var(--muted)">${T(S.profile?"Update your details":"Add your name and mobile number so the shop can reach you.")}</p>${profileFields()}<div style="height:12px"></div><div class="form">${noteField}</div>`;
  const p=S.profile;
  return `<div class="who"><span class="av">${esc(initials(p.full_name))}</span><div><b>${esc(p.full_name)}</b><span dir="ltr">${esc(p.phone)}</span></div><button class="linkbtn" id="editProf">${T("Edit")}</button></div>
    ${isFront()?`<label class="check"><input type="checkbox" id="wkOn" ${S.walkin.on?"checked":""}>${T("Book for a walk-in or phone customer")}</label>
      <div class="form" ${S.walkin.on?"":"hidden"} id="wkF" style="margin-bottom:12px"><div class="field"><label for="wkName">${T("Customer name")}</label><input id="wkName" value="${esc(S.walkin.name)}"></div><div class="field"><label for="wkPhone">${T("Customer phone")} <span style="color:var(--muted);font-weight:400">(${T("optional")})</span></label><input id="wkPhone" type="tel" dir="ltr" value="${esc(S.walkin.phone)}"></div></div>`:""}
    ${homeBlock()}
    ${priceBlock()}
    ${payChooser()}
    <div class="form">${noteField}</div>`;
}
function priceBlock(){
  const svc=svcOf();if(!svc)return"";const q=S.quote&&S.quote.base!=null?S.quote:null;
  const base=Number(svc.price),pct=q?q.pct:dayPct(S.sel.date),fin=q?Number(q.final):Math.round(base*(100-pct))/100;
  const fee=homeFee();
  const why=q&&q.label==="package"?T("Covered by your package"):q&&q.reward?T("Free cut (loyalty reward)"):q&&q.label==="birthday"?T("{0}% birthday discount 🎂",pct):q&&q.label==="code"?T("{0}% off with code {1}",pct,esc(q.code)):pct?T("{0}% off today",pct):"";
  return `<div class="priceblk"><div class="prow"><span>${esc(svc.name)}</span><b>${EGP(base)}</b></div>
    ${pct?`<div class="prow disc"><span>${why}</span><b>−${EGP(base-fin)}</b></div>`:""}
    ${fee?`<div class="prow"><span>🏠 ${T("Home visit")}</span><b>+${EGP(fee)}</b></div>`:""}
    <div class="prow total"><span>${T("You pay")}</span><b>${EGP(fin+fee)}</b></div>
    ${isFront()&&S.walkin.on?"":`<div class="promo"><input id="promoIn" dir="ltr" autocapitalize="characters" placeholder="${T("Promo code")}" value="${esc(S.promo.code||S.promo.input)}" ${S.promo.code?"readonly":""}>${S.promo.code?`<button class="btn ghost sm" id="promoClear" type="button">${T("Remove")}</button>`:`<button class="btn ghost sm" id="promoApply" type="button">${T("Apply")}</button>`}</div>
    ${S.promo.err?`<div class="err">${esc(S.promo.err)}</div>`:S.promo.code?`<div class="sub" style="color:var(--ok)">${T("Code {0} applied.",esc(S.promo.code))}</div>`:""}`}</div>`;
}
function payChooser(){
  const ms=payMethods();if(!ms.includes(S.payPref))S.payPref=ms[0];
  const tgt=payTarget(S.payPref);
  return `<div class="field full paychoose"><label>${T(isFront()&&S.walkin.on?"How is the customer paying?":"How will you pay?")}</label>
    <div class="paym">${ms.map(m=>`<button type="button" class="pmeth" data-pref="${m}" aria-pressed="${S.payPref===m}">${prefLabel(m)}</button>`).join("")}</div>
    ${!(isFront()&&S.walkin.on)&&tgt?`<div class="sub" style="margin-top:6px">${T("You can pay right after you book. Show the shop your transfer when you arrive.")}</div>`:""}
    ${isFront()&&S.walkin.on?`<label class="check" style="margin-top:8px"><input type="checkbox" id="wkPaid" ${S.walkin.paid?"checked":""}>${T("Already paid")}</label>`:""}</div>`;
}
function profileFields(){
  const p=S.profile||{},meta=S.session?.user?.user_metadata||{};
  return `<div class="form"><div class="field"><label for="pName">${T("Full name")}</label><input id="pName" autocomplete="name" value="${esc(p.full_name||meta.full_name||"")}"><div class="err" id="epName"></div></div>
  <div class="field"><label for="pPhone">${T("Mobile number")}</label><input id="pPhone" type="tel" dir="ltr" inputmode="tel" autocomplete="tel" placeholder="010 1234 5678" value="${esc(p.phone||"")}"><div class="err" id="epPhone"></div></div></div>`;
}
async function saveProfile(root){
  const q=s=>root.querySelector(s);
  const n=q("#pName"),ph=q("#pPhone");const name=n.value.trim(),phone=normPhone(ph.value);let bad=false;
  q("#epName").textContent="";q("#epPhone").textContent="";
  if(name.length<2){q("#epName").textContent=T("Enter your full name.");bad=true}
  if(!validPhone(phone)){q("#epPhone").textContent=T("Enter a mobile number, e.g. 010 1234 5678.");bad=true}
  if(bad){(name.length<2?n:ph).focus();return false}
  const row={id:uid(),full_name:name,phone,updated_at:new Date().toISOString()},bd=q("#pBday");if(bd&&bd.value&&!S.profile?.birthday)row.birthday=bd.value;
  const {data,error}=await sb.from("profiles").upsert(row).select().single();
  if(error){toast(errMsg(error));return false}
  S.profile=data;S.profEdit=false;return true;
}
function renderBar(){
  const show=S.tab==="book"&&!S.done&&S.loaded&&!S.loadErr&&activeServices().length>0&&!(shopPaused()&&!isFront());
  $("bar").hidden=!show;if(!show)return;
  const s=S.sel,svc=svcOf(),brb=s.barber==="any"?T("Any barber"):activeBarbers().find(b=>b.id===s.barber)?.name;
  const line=[svc?.name,brb].filter(Boolean).join(" · ");
  const when=s.date&&s.time!=null?`${nice(s.date)} · ${fmt(s.time)}`:"";
  $("barSum").innerHTML=svc?`<b>${esc(line)}</b><span>${esc(when||T("No time picked yet"))} · <span class="price-t">${EGP((S.step===4&&S.quote&&S.quote.base!=null?Number(S.quote.final):Math.round(Number(svc.price)*(100-(s.date?dayPct(s.date):0)))/100)+homeFee())}</span></span>`:`<b>${T("Book a chair")}</b><span>${T("Takes under a minute")}</span>`;
  const btn=$("barBtn");
  if(S.step===4){
    if(!S.session){btn.textContent=T(S.authMode==="signup"?"Create account":"Sign in");btn.disabled=false}
    else{btn.textContent=S.busy?T("Booking…"):T(!S.profile||S.profEdit?"Save & confirm":"Confirm booking");btn.disabled=S.busy}
  }else{btn.textContent=T("Continue");btn.disabled=!({1:!!s.service,2:!!s.barber,3:s.time!=null}[S.step])}
}
function nextStep(){const s=S.sel;S.step=!s.service?1:!s.barber?2:(s.time==null?3:4);renderBook();
  setTimeout(()=>$("acc"+S.step).scrollIntoView({behavior:"smooth",block:S.step===4?"start":"nearest"}),40)}
$("steps").addEventListener("click",async e=>{
  if(e.target.closest("#retry")){S.loaded=false;renderBook();loadConfig();return}
  if(e.target.closest("#editProf")){S.profEdit=true;renderBook();return}
  const pf=e.target.closest("[data-pref]");if(pf){S.payPref=pf.dataset.pref;renderBook();return}
  const hm=e.target.closest("[data-home]");if(hm){S.home.on=hm.dataset.home==="1";
    if(S.sel.date&&S.sel.time!=null&&!startsFor(S.sel.date).includes(S.sel.time)){S.sel.time=null;S.step=3;toast(T(S.home.on?"That time is too short for a home visit. Pick another time.":"Pick a time again."))}renderBook();return}
  if(e.target.closest("#promoApply")){const v=($("promoIn").value||"").trim().toUpperCase();if(!v){S.promo.err=T("Type a promo code first.");renderBook();return}S.promo={input:v,code:v,err:""};S.quoteKey="";loadQuote();return}
  if(e.target.closest("#promoClear")){S.promo={input:"",code:null,err:""};S.quoteKey="";loadQuote();renderBook();return}
  const wj=e.target.closest("[data-wjoin]");if(wj){wj.disabled=true;const {error}=await sb.from("waitlist").insert({customer_id:uid(),day:S.sel.date,service_id:S.sel.service,barber_id:S.sel.barber==="any"?null:S.sel.barber});
    if(error&&!/duplicate/i.test(error.message)){toast(errMsg(error));wj.disabled=false;return}toast(T("You're on the waiting list. We'll show you here if a time opens up."));loadWait();return}
  const wl=e.target.closest("[data-wleave]");if(wl){await sb.from("waitlist").delete().eq("id",wl.dataset.wleave);toast(T("Removed from the waiting list."));loadWait();return}
  const o=e.target.closest("[data-open]");if(o){const n=Number(o.dataset.open);if(stateOf(n)!=="todo"&&n!==S.step){S.step=n;renderBook()}return}
  const sv=e.target.closest("[data-svc]");if(sv){if(S.sel.service!==sv.dataset.svc){S.sel.service=sv.dataset.svc;S.sel.time=null}nextStep();return}
  const br=e.target.closest("[data-brb]");if(br){if(S.sel.barber!==br.dataset.brb){S.sel.barber=br.dataset.brb;S.sel.time=null}nextStep();return}
  const dy=e.target.closest("[data-day]");if(dy&&!dy.disabled){const sl=$("daystrip").scrollLeft;S.sel.date=dy.dataset.day;S.sel.time=null;renderBook();$("daystrip").scrollLeft=sl;return}
  const q=e.target.closest("[data-quick]");if(q){const[d,t]=q.dataset.quick.split("|");S.sel.date=d;S.sel.time=Number(t);nextStep();return}
  const tm=e.target.closest("[data-time]");if(tm){S.sel.time=Number(tm.dataset.time);nextStep()}
});
$("steps").addEventListener("input",e=>{const t=e.target;
  if(t.id==="cNote")S.note=t.value;if(t.id==="promoIn"){S.promo.input=t.value;S.promo.err=""}if(t.id==="wkName")S.walkin.name=t.value;if(t.id==="wkPhone")S.walkin.phone=t.value;if(t.id==="hAddr")S.home.address=t.value});
$("steps").addEventListener("change",e=>{if(e.target.id==="wkPaid")S.walkin.paid=e.target.checked;if(e.target.id==="wkOn"){S.walkin.on=e.target.checked;$("wkF").hidden=!e.target.checked}});
$("barBtn").addEventListener("click",()=>{if(S.step!==4)return nextStep();
  if(!S.session){const f=$("acc4").querySelector("[data-authform]");if(f)f.requestSubmit();return}
  submit()});
async function submit(){
  if(S.busy)return;S.busy=true;renderBar();
  try{
    if(!S.profile||S.profEdit){if(!(await saveProfile($("acc4"))))return}
    if(isFront()&&S.walkin.on&&!S.walkin.name.trim()){toast(T("Add the customer's name, or untick walk-in."));$("wkName")?.focus();return}
    const s=S.sel;
    const walk=isFront()&&S.walkin.on,home=homeOn();
    if(home&&S.home.address.trim().length<8){toast(T("Please write the full address for the home visit."));$("hAddr")?.focus();return}
    const {data,error}=await sb.rpc("book3",{p_service:s.service,p_barber:s.barber==="any"?null:s.barber,p_day:s.date,p_start_min:s.time,p_note:S.note||null,
      p_name:walk?S.walkin.name.trim():null,p_phone:walk?normPhone(S.walkin.phone):null,p_code:walk?null:S.promo.code,p_home:home,p_address:home?S.home.address.trim():null});
    if(error){const m=error.message||"";
      if(/taken|passed|outside|closed|off that day/i.test(m)){S.sel.time=null;S.step=3;await loadBusy()}
      toast(errMsg(error));return}
    let done=data;
    const pr=await sb.rpc("set_pay_pref",{p_id:data.id,p_method:S.payPref});if(!pr.error)done={...done,pay_pref:S.payPref};
    if(walk&&S.walkin.paid){const mp=await sb.rpc("mark_paid",{p_id:data.id,p_method:S.payPref,p_amount:Number(data.price)});if(!mp.error){done=mp.data;autoPrint(done)}}
    S.done=done;S.note="";S.walkin={on:false,name:"",phone:"",paid:false};S.home={on:false,address:""};S.promo={input:"",code:null,err:""};S.quote=null;S.quoteKey="";loadWait();
    loadBusy();loadMine();if(isFront())loadSched();if(isAdmin())loadDash();
    window.scrollTo({top:0,behavior:"smooth"});
  }finally{S.busy=false;renderBook()}
}
function donePay(b){
  if(b.paid_at)return `<div class="card sbox dpay"><div class="paydone"><span class="pill completed">${T("Paid")}</span><b>${EGP(b.paid_amount)}</b><span>${payLabel(b.pay_method)}</span></div></div>`;

function nextFreeChair(){
  if(!S.cfg||shopPaused())return null;
  for(let i=0;i<3;i++){const k=addDays(today(),i);if(isClosedDay(k))continue;
    for(const t of slotTimes())if(freeBarbers(k,t,STEP).length)return{k,t}}

function weekRows(){
  const c=cfg(),rows=[];
  for(let i=0;i<7;i++){const k=addDays(today(),i),d=parseKey(k).getDay(),closed=(c.closed_days||[]).includes(d),hol=(c.holidays||[]).includes(k);
    rows.push(`<div class="hrs ${i===0?"now":""}"><span>${i===0?T("Today"):dayName(d,"long")}</span><b>${closed?T("Closed"):hol?T("Closed (holiday)"):`<span>${fmtS(c.open)} – ${fmtS(c.close)}</span>`}</b></div>`)}

/* ===== schedule (owner: all barbers; barber: own column) ===== */
async function loadSched(){
  if(!isFront()&&!isBarber())return;
  const d=S.schedDate;let q=sb.from("bookings").select("*").eq("day",d).neq("status","cancelled").order("start_min");
  if(isBarber())q=q.eq("barber_id",S.barberId);
  const {data,error}=await q;
  if(error||d!==S.schedDate)return;
  S.schedRows=data;if(S.tab==="sched")renderSched();if(S.sheetId)renderSheet();
}
function renderSched(){
  if(!isFront()&&!isBarber())return;
  renderMyClock();
  $("sPrev").innerHTML=LANG==="ar"?ICON.next:ICON.prev;$("sNext").innerHTML=LANG==="ar"?ICON.prev:ICON.next;
  $("sLabel").textContent=S.schedDate===today()?T("Today"):dshort(S.schedDate);
  const off=isBarber()&&barberOff(S.barberId,S.schedDate);
  $("sActs").innerHTML=`<input type="date" id="sDate" value="${S.schedDate}" style="width:auto;padding:7px 10px" aria-label="${T("Jump to date")}"><button class="btn ghost sm" id="sToday">${T("Today")}</button>`+
    (isFront()?`<button class="btn sm" id="sNew">${T("New booking")}</button>`:"")+
    (isBarber()&&S.schedDate>=today()?`<button class="btn ${off?"soft":"ghost"} sm" id="sOff">${T(off?"I'm working this day":"Take this day off")}</button>`:"");
  const rows=S.schedRows,exp=rows.filter(r=>r.status!=="no_show").reduce((a,r)=>a+Number(r.price),0);
  const coll=rows.filter(r=>r.paid_at).reduce((a,r)=>a+Number(r.paid_amount||0),0);
  $("sStats").innerHTML=[[T("Bookings"),rows.length],[T("Done"),rows.filter(r=>r.status==="completed").length],[T("Collected"),EGP(coll)],[T("Expected"),EGP(exp)]].map(([l,v])=>`<div class="card stat"><span>${l}</span><b>${v}</b></div>`).join("");
  let bs=cfg().barbers.filter(b=>b.active||rows.some(r=>r.barber_id===b.id));
  if(isBarber())bs=bs.filter(b=>b.id===S.barberId);
  if(!bs.length){$("sBody").innerHTML=`<div class="empty"><b>${T("No barbers yet")}</b>${T("Add them in Settings to see the day's timeline.")}</div>`;return}
  if(isClosedDay(S.schedDate)&&!rows.length){$("sBody").innerHTML=`<div class="empty"><b>${T("The shop is closed that day.")}</b></div>`;return}
  const T_=slotTimes(),nb=bs.length,ROW=46,o=toMin(cfg().open);
  let h=`<div class="tl" style="grid-template-columns:58px repeat(${nb},minmax(150px,1fr));grid-template-rows:auto repeat(${T_.length},${ROW}px)">`;
  h+=`<div class="hd" style="grid-column:1;grid-row:1"></div>`+bs.map((b,i)=>`<div class="hd" style="grid-column:${i+2};grid-row:1"><span class="av">${esc(initials(b.name))}</span>${esc(b.name)}${barberOff(b.id,S.schedDate)?` <span class="pill">${T("Day off")}</span>`:""}</div>`).join("");
  T_.forEach((t,r)=>{h+=`<div class="tm" style="grid-column:1;grid-row:${r+2}">${t%60===0?fmt(t).replace(":00",""):""}</div>`;for(let i=0;i<nb;i++)h+=`<div class="cell ${t%60?"half":""} ${barberOff(bs[i].id,S.schedDate)?"offcell":""}" style="grid-column:${i+2};grid-row:${r+2}"></div>`});
  for(const x of rows){const bi=bs.findIndex(b=>b.id===x.barber_id),r=T_.indexOf(x.start_min);if(bi<0||r<0)continue;
    h+=`<button class="blk ${esc(x.status)}" data-bid="${esc(x.id)}" style="grid-column:${bi+2};grid-row:${r+2}/span ${Math.max(1,Math.round(x.minutes/STEP))}"><b>${x.is_home?"🏠 ":""}${esc(x.customer_name)}</b><span>${fmt(x.start_min)} · ${esc(x.service_name)}${x.status!=="confirmed"?" · "+statusLabel(x.status):""}${x.paid_at?" · "+T("Paid"):""}</span></button>`}
  if(S.schedDate===today()){const n=nowMin();if(n>=o&&n<o+T_.length*STEP){const r=Math.floor((n-o)/STEP);h+=`<div class="nowline" style="grid-column:2/${nb+2};grid-row:${r+2};align-self:start;margin-top:${((n-o)%STEP)/STEP*ROW}px"></div>`}}
  $("sBody").innerHTML=`<div class="tl-wrap">${h}</div></div>`+(rows.length?"":`<p style="color:var(--muted);text-align:center;font-size:.9rem;margin-top:14px">${T("No bookings on this day yet.")}</p>`);
}

async function loadReport(){
  if(!isAdmin())return;
  const m=S.rep.month,[y,mo]=m.split("-").map(Number),first=`${m}-01`,last=keyOf(new Date(y,mo,0));
  S.rep.rows=null;renderReport();
  const {data,error}=await sb.from("bookings").select("*").gte("day",first).lte("day",last).neq("status","cancelled").order("starts_at").limit(5000);
  if(error){toast(errMsg(error));return}
  const sl=await sb.from("sales").select("*").gte("sold_at",new Date(y,mo-1,1).toISOString()).lt("sold_at",new Date(y,mo,1).toISOString()).limit(5000);
  if(m===S.rep.month){S.rep.rows=data;S.rep.sales=sl.data||[];renderReport()}
}

/* ===== staff: attendance, salaries, performance ===== */
const monthFirst=m=>`${m}-01`;
const monthLast=m=>{const[y,mo]=m.split("-").map(Number);return keyOf(new Date(y,mo,0))};
const monthTitle=m=>{const[y,mo]=m.split("-").map(Number);return new Date(y,mo-1,1).toLocaleDateString(LOC(),{month:"long",year:"numeric"})};
const shiftMonth=(m,n)=>{const[y,mo]=m.split("-").map(Number);const d=new Date(y,mo-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
const LATE_GRACE=10;
const hhmm=iso=>{const d=new Date(iso);return fmt(d.getHours()*60+d.getMinutes())};
const lateBy=a=>{const d=new Date(a.clock_in),v=d.getHours()*60+d.getMinutes()-toMin(cfg().open);return v>LATE_GRACE?v:0};
const attMins=a=>{const end=a.clock_out?new Date(a.clock_out):a.day===today()?new Date():null;return end?Math.max(0,Math.round((end-new Date(a.clock_in))/60000)):0};
const hrs=m=>T("{0}h {1}m",Math.floor(m/60),pad(m%60));
const KINDL={bonus:"Bonus",advance:"Advance",deduction:"Deduction"};
const firstOfDay=A=>{const f=new Map();[...A].sort((a,b)=>a.clock_in.localeCompare(b.clock_in)).forEach(a=>{const k=a.person_id+"|"+a.day;if(!f.has(k))f.set(k,a)});return f};
function staffPeople(){const D=S.st.data;
  return[...cfg().barbers.filter(b=>b.active).map(b=>({id:b.id,kind:"barber",name:b.name,login:b.login_username||"",salary:Number(b.base_salary||0),pct:Number(b.commission_pct||0)})),
    ...((D&&D.desk)||[]).filter(d=>d.active).map(d=>({id:d.id,kind:"desk",name:d.name,login:d.login_username||"",salary:Number(d.base_salary||0),pct:0}))]}
function payFor(p,bk,adj){
  const earned=p.kind==="barber"?bk.filter(r=>r.barber_id===p.id&&r.status==="completed").reduce((a,r)=>a+Number(r.price),0):0;
  const comm=Math.round(earned*p.pct)/100,sum=k=>adj.filter(a=>a.person_id===p.id&&a.kind===k).reduce((x,a)=>x+Number(a.amount),0);
  const bonus=sum("bonus"),adv=sum("advance"),ded=sum("deduction");
  return{earned,comm,bonus,adv,ded,base:p.salary,net:Math.round((p.salary+comm+bonus-adv-ded)*100)/100}}
async function loadStaff(){
  if(!isAdmin())return;const m=S.st.month,f=monthFirst(m),l=monthLast(m),[y,mo]=m.split("-").map(Number),a=new Date(y,mo-1,1).toISOString(),b=new Date(y,mo,1).toISOString();
  S.st.data=null;renderStaff();
  const res=await Promise.all([sb.from("desk_staff").select("*").order("created_at"),
    sb.from("attendance").select("*").gte("day",f).lte("day",l).order("clock_in",{ascending:false}).limit(3000),
    sb.from("attendance").select("*").eq("day",today()).order("clock_in"),
    sb.from("staff_adjust").select("*").eq("month",f).order("created_at",{ascending:false}),
    sb.from("staff_payouts").select("*").eq("month",f),
    sb.from("bookings").select("id,barber_id,barber_name,status,price,day").gte("day",f).lte("day",l).neq("status","cancelled").limit(5000),
    sb.from("sales").select("barber_name,total,qty").gte("sold_at",a).lt("sold_at",b).limit(5000),
    sb.from("reviews").select("rating,barber_name,created_at").gte("created_at",a).lt("created_at",b).limit(2000)]);
  const bad=res.slice(0,6).find(r=>r.error);if(bad){toast(errMsg(bad.error));return}
  if(m!==S.st.month)return;
  const [ds,at,tod,adj,po,bk,sl,rv]=res;
  S.st.data={desk:ds.data,att:at.data,today:tod.data,adj:adj.data,pay:po.data,bk:bk.data,sales:sl.data||[],rev:rv.data||[]};renderStaff();
}

async function loadMyClock(){

    sb.from("staff_payouts").select("*").eq("person_id",id).eq("month",f).maybeSingle(),
    isBarber()?sb.from("bookings").select("barber_id,status,price").eq("barber_id",id).gte("day",f).lte("day",monthLast(m)).eq("status","completed").limit(3000):Promise.resolve({data:[]}),
    isDesk()?sb.from("desk_staff").select("*").eq("id",id).maybeSingle():Promise.resolve({data:null})]);

/* ===== phone notifications (web push) ===== */
const VAPID="BFWx0ke6Ol_cQPV00gulyrH0hDw8f3z3O26A8M12rhwFvfUYyhoXV2tuPcQogtQpo3ZR_HrsSN5XR2TKb__hPmk";
const pushOK=()=>"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;
const b64u=s=>{const b=atob((s+"=".repeat((4-s.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(b,c=>c.charCodeAt(0))};
async function refreshPush(){
  let st="off";
  try{if(isIOS()&&!isStandalone())st="ios";else if(!pushOK())st="unsupported";else if(Notification.permission==="denied")st="denied";
    else{const r=await navigator.serviceWorker.getRegistration();const s=r&&await r.pushManager.getSubscription();st=s&&Notification.permission==="granted"?"on":"off"}}catch(e){st="unsupported"}
  if(st!==S.push){S.push=st;if(S.tab==="account")renderAccount();if(S.tab==="dash")renderDash();if(S.done&&S.tab==="book")renderDone()}
}
async function enablePush(btn){
  if(!S.session){toast(T("Sign in first."));return}
  if(btn)btn.disabled=true;
  try{
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){toast(T("Notifications were blocked. You can allow them in your browser settings."));await refreshPush();return}
    const reg=await navigator.serviceWorker.ready;
    const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID)});
    const j=sub.toJSON(),row={endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,lang:LANG};
    let r=await sb.from("push_subs").insert(row);
    if(r.error&&/duplicate|unique/i.test(r.error.message))r=await sb.from("push_subs").update({lang:LANG}).eq("endpoint",j.endpoint);
    if(r.error)throw r.error;
    sb.rpc("push_test");toast(T("Notifications are on. We just sent you a test."));
  }catch(e){toast(errMsg(e))}finally{if(btn&&btn.isConnected)btn.disabled=false;S.push=null;refreshPush()}
}
async function disablePush(btn){
  if(btn)btn.disabled=true;
  try{const r=await navigator.serviceWorker.getRegistration(),s=r&&await r.pushManager.getSubscription();
    if(s){await sb.from("push_subs").delete().eq("endpoint",s.endpoint);await s.unsubscribe()}toast(T("Notifications are off."))}
  catch(e){toast(errMsg(e))}finally{S.push=null;refreshPush()}
}
function pushCard(kind){
  const st=S.push;if(!S.session||!st||st==="unsupported")return"";
  const why=kind==="staff"?T("Get a ping on this phone for every new booking and cancellation."):T("Get a reminder on this phone 2 hours before your appointment, and a message if the shop changes it.");
  if(kind==="done"&&st==="on")return"";
  const body=st==="on"?`<div class="acts"><span class="pill confirmed">${T("On for this phone")}</span><button class="btn ghost sm" data-push="off">${T("Turn off")}</button><button class="linkbtn" data-push="test">${T("Send a test")}</button></div>`
    :st==="ios"?`<p class="sub" style="margin:0">${T("On iPhone: first add this website to your Home Screen (Share → Add to Home Screen), open it from there, then turn notifications on.")}</p>`
    :st==="denied"?`<p class="sub" style="margin:0">${T("Notifications are blocked for this site. Allow them in your browser settings, then come back.")}</p>`
    :`<button class="btn ${kind==="done"?"soft":""} sm" data-push="on">🔔 ${T(kind==="done"?"Remind me before my appointment":"Turn on notifications")}</button>`;
  return `<div class="card sbox pushcard"><h3>${T("Phone notifications")}</h3><p>${why}</p>${body}</div>`;
}

    ${line(T("Date"),esc(parseKey(b.day).toLocaleDateString(LOC(),{weekday:"short",day:"numeric",month:"short",year:"numeric"}))+" · "+fmt(b.start_min))}
    ${line(T("Customer"),esc(b.customer_name))}
    ${line(T("Barber"),esc(b.barber_name))}

    ${line(esc(b.service_name),EGP(base-fee))}
