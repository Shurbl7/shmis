      const old=S.products.find(x=>x.id===t.dataset.pimg)?.image_path;const r=await sb.from("products").update({image_path:path}).eq("id",t.dataset.pimg);if(r.error)throw r.error;
      if(old)sb.storage.from("gallery").remove([old]);toast(T("Photo saved."));loadPublicExtras()}catch(err){toast(errMsg(err))}return}
  if(t.dataset.pdesc){await sb.from("products").update({description:t.value.trim()||null}).eq("id",t.dataset.pdesc);toast(T("Saved."));loadPublicExtras();return}
  if(t.dataset.gcap){await sb.from("gallery").update({caption:t.value.trim()||null}).eq("id",t.dataset.gcap);loadPublicExtras();return}
  if(t.dataset.pn||t.dataset.pp||t.dataset.ps!==undefined&&t.dataset.ps){const id=t.dataset.pn||t.dataset.pp||t.dataset.ps;const row=t.dataset.pn?{name:t.value.trim()}:t.dataset.pp?{price:Number(t.value)||0}:{stock:t.value===""?null:Number(t.value)};
    const {error}=await sb.from("products").update(row).eq("id",id);if(error){toast(errMsg(error));return}toast(T("Saved."));loadPublicExtras();return}if(e.target.id==="setNs"&&S.draft)S.draft.noshow_limit=Number(e.target.value);if(e.target.id==="setLoy"&&S.draft)S.draft.loyalty_every=Number(e.target.value);if(e.target.id==="setBday"&&S.draft)S.draft.birthday_pct=Number(e.target.value);refreshSave()});
$("settings").addEventListener("click",async e=>{const D=S.draft,t=e.target.closest("button");if(!t||!D)return;const d=t.dataset;
  if(d.cd!==undefined){const i=Number(d.cd);D.closed_days=D.closed_days.includes(i)?D.closed_days.filter(x=>x!==i):D.closed_days.concat(i).sort();renderSettings(false);return}
  if(d.gdel){const {error}=await sb.storage.from("gallery").remove([d.path]);const r=await sb.from("gallery").delete().eq("id",d.gdel);if(error||r.error){toast(errMsg(error||r.error));return}toast(T("Photo removed."));loadPublicExtras();return}
  if(t.id==="npAdd"){const name=$("npName").value.trim(),price=Number($("npPrice").value),st=$("npStock").value===""?null:Number($("npStock").value);if(!name||!(price>=0)){toast(T("Add a product name and price."));return}
    const {error}=await sb.from("products").insert({name,price,stock:st});if(error){toast(errMsg(error));return}toast(T("Product added."));loadPublicExtras();return}
  if(d.ptog){const p=S.products.find(x=>x.id===d.ptog);await sb.from("products").update({active:!p.active}).eq("id",p.id);loadPublicExtras();return}
  if(d.pmt){const m=d.pmt;D.pay_methods=D.pay_methods.includes(m)?D.pay_methods.filter(x=>x!==m):D.pay_methods.concat(m);if(!D.pay_methods.length){D.pay_methods=["cash"];toast(T("Keep at least one payment method."))}renderSettings(false);return}
  if(t.id==="pcAdd"){const code=($("pcCode").value||"").trim().toUpperCase(),pct=Number($("pcPct").value),exp=$("pcExp").value||null,mx=Number($("pcMax").value)||null;
    if(!/^[A-Z0-9_-]{3,20}$/.test(code)){toast(T("Code: 3–20 letters or numbers, no spaces."));return}
    if(!(pct>=1&&pct<=100)){toast(T("Discount must be between 1 and 100%."));return}
    const {error}=await sb.from("promos").insert({code,percent:pct,expires_on:exp,max_uses:mx});
    if(error){toast(/duplicate/i.test(error.message)?T("That code already exists."):errMsg(error));return}
    toast(T("Code {0} added.",code));loadPromos();return}
  if(d.pctog){const pc=S.promos.find(x=>x.code===d.pctog);const {error}=await sb.from("promos").update({active:!pc.active}).eq("code",pc.code);if(error){toast(errMsg(error));return}loadPromos();return}
  if(d.pcdel){const {error}=await sb.from("promos").delete().eq("code",d.pcdel);if(error){toast(errMsg(error));return}toast(T("Code removed."));loadPromos();return}
  if(t.id==="addHol"){const v=$("holDate").value;if(!v){toast(T("Pick a date first."));return}if(!D.holidays.includes(v))D.holidays=D.holidays.concat(v).sort();renderSettings(false);return}
  if(d.rh!==undefined){D.holidays=D.holidays.filter(h=>h!==d.rh);renderSettings(false);return}
  if(t.id==="addOff"){const b=$("offB").value,v=$("offD").value;if(!b||!v){toast(T("Pick a barber and a date first."));return}
    const {error}=await sb.from("barber_days_off").insert({barber_id:b,day:v});if(error&&!/duplicate/i.test(error.message)){toast(errMsg(error));return}
    await loadConfig();renderSettings(false);loadBusy();toast(T("Day off saved."));return}
  if(d.roff!==undefined){const[b,v]=d.roff.split("|");const {error}=await sb.from("barber_days_off").delete().eq("barber_id",b).eq("day",v);if(error){toast(errMsg(error));return}
    await loadConfig();renderSettings(false);loadBusy();toast(T("Day off removed."));return}
  if(d.rb!==undefined){const[r]=D.barbers.splice(Number(d.rb),1);if(r.id)D.removedB.push(r.id);renderSettings(false);return}
  if(d.rs!==undefined){const[r]=D.services.splice(Number(d.rs),1);if(r.id)D.removedS.push(r.id);renderSettings(false);return}
  if(t.id==="addB"){D.barbers.push({name:"",login:"",pct:0});renderSettings(false);$("bn"+(D.barbers.length-1)).focus();return}
  if(t.id==="addS"){D.services.push({name:"",minutes:30,price:0});renderSettings(false);$("sn"+(D.services.length-1)).focus();return}
  if(t.id==="resetSet"){renderSettings(true);return}
  if(t.id==="saveSet")saveSettings(t);
  if(d.gotoHome)showTab("home");
});
async function saveSettings(btn){
  const D=S.draft;
  if(!D.shop_name.trim()){toast(T("Add a shop name."));return}
  const cl=toMin(D.close)===0?1440:toMin(D.close);
  if(cl<=toMin(D.open)){toast(T("Closing time must be after opening time."));return}
  const logins=D.barbers.map(b=>b.login.trim().toLowerCase()).filter(Boolean);
  if(logins.some(l=>!validUname(l))){toast(T("Barber login: 3–20 letters, numbers, dots or underscores."));return}
  if(new Set(logins).size!==logins.length){toast(T("Two barbers can't share one login."));return}
  if(D.instapay_link.trim()&&!/^https:\/\//.test(D.instapay_link.trim())){toast(T("The InstaPay link should start with https://"));return}
  if(D.maps_url.trim()&&!/^https:\/\//.test(D.maps_url.trim())){toast(T("The Google Maps link should start with https://"));return}
  btn.disabled=true;btn.textContent=T("Saving…");
  try{
    const ops=[sb.from("settings").update({shop_name:D.shop_name.trim(),open_time:D.open,close_time:D.close,closed_days:D.closed_days,holidays:D.holidays,noshow_limit:D.noshow_limit,instapay_address:D.instapay_address.trim()||null,instapay_link:D.instapay_link.trim()||null,vodafone_number:D.vodafone_number.trim()||null,wallet_names:D.wallet_names.trim()||null,pay_methods:D.pay_methods,day_discounts:D.day_discounts,loyalty_every:D.loyalty_every,birthday_pct:D.birthday_pct,home_enabled:D.home_enabled,home_fee:D.home_fee,home_extra_min:D.home_extra_min,home_area:D.home_area.trim()||null,points_per_100:D.points_per_100,point_value:D.point_value,points_min:D.points_min,tagline:D.tagline.trim()||null,about:D.about.trim()||null,address:D.address.trim()||null,phone:D.phone.trim()||null,instagram:D.instagram.trim().replace(/^@/,"").replace(/^https?:\/\/(www\.)?instagram\.com\//,"").replace(/\/$/,"")||null,maps_url:D.maps_url.trim()||null,google_rating:D.google_rating===""?null:Math.min(5,Math.max(0,Number(D.google_rating))),google_count:D.google_count===""?null:Math.max(0,Math.round(Number(D.google_count))),updated_at:new Date().toISOString()}).eq("id",1)];
    if(D.removedB.length)ops.push(sb.from("barbers").update({active:false,login_username:null}).in("id",D.removedB));
    if(D.removedS.length)ops.push(sb.from("services").update({active:false}).in("id",D.removedS));
    D.services.filter(s=>s.name.trim()).forEach((s,i)=>ops.push(s.id?sb.from("services").update({name:s.name.trim(),minutes:s.minutes,price:s.price||0,sort:i+1}).eq("id",s.id):sb.from("services").insert({name:s.name.trim(),minutes:s.minutes,price:s.price||0,sort:i+1})));
    let res=await Promise.all(ops);let bad=res.find(r=>r.error);if(bad)throw bad.error;
    // barbers: clear logins first so swapping usernames doesn't clash
    const existing=D.barbers.filter(b=>b.id);
    if(existing.length){const r=await sb.from("barbers").update({login_username:null}).in("id",existing.map(b=>b.id));if(r.error)throw r.error}
    res=await Promise.all(D.barbers.filter(b=>b.name.trim()).map((b,i)=>{const row={name:b.name.trim(),sort:i+1,login_username:b.login.trim().toLowerCase()||null,commission_pct:b.pct||0};
      return b.id?sb.from("barbers").update(row).eq("id",b.id):sb.from("barbers").insert(row)}));
    bad=res.find(r=>r.error);if(bad)throw bad.error;
    await loadConfig();renderSettings(true);toast(T("Settings saved."));
  }catch(err){toast(/unique|duplicate/i.test(err.message||"")?T("That login username is already used by another barber."):errMsg(err));renderSettings(false)}
}

/* ===== live updates ===== */
let chan=null,liveT;
function subLive(){unsubLive();
  chan=sb.channel("live").on("postgres_changes",{event:"*",schema:"public",table:"bookings"},()=>{clearTimeout(liveT);liveT=setTimeout(()=>{loadMine();if(isAdmin()||isBarber())loadSched();if(isAdmin())loadDash();loadBusy()},400)})
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"settings"},()=>loadConfig()).subscribe()}
function unsubLive(){if(chan){sb.removeChannel(chan);chan=null}}

function renderAll(){renderNav();renderStatus();renderTab();renderBar()}
applyLang();renderAll();
loadConfig().then(loadBusy);
setInterval(()=>{if(!S.session)loadConfig();renderStatus();loadBusy();if(S.tab==="sched"&&S.schedDate===today())renderSched()},30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){loadBusy();loadMine();if(isAdmin()||isBarber())loadSched();if(isAdmin())loadDash()}});
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
